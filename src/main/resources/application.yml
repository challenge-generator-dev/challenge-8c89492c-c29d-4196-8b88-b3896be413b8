server:
  port: 8080

spring:
  application:
    name: payment-resilience-service
  profiles:
    active: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    retries:
      enabled: true

resilience4j:
  retry:
    instances:
      paymentRetry:
        maxAttempts: 3
        waitDuration: 1000
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - domain.model.PaymentFailedException
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        maxRetryInterval: 10000
        retryPolicy:
          maxAttempts: 3
          waitDuration: 1000
        eventConsumerBufferSize: 10
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s

  circuitbreaker:
    instances:
      paymentCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - domain.model.PaymentFailedException
        ignoreExceptions:
          - domain.model.CircuitBreakerOpenException

  timelimiter:
    instances:
      paymentTimeLimiter:
        timeoutDuration: 5s
        cancelRunningFuture: true
        eventConsumerBufferSize: 100

  bulkhead:
    instances:
      paymentBulkhead:
        maxConcurrentCalls: 10
        maxWaitDuration: 0ms
        bulkheadType: SEMAPHORE

logging:
  level:
    root: INFO
    com.example: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.retry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

payment:
  provider:
    base-url: "http://localhost:9090"
    connection-timeout: 5000
    read-timeout: 10000
    max-connections: 50
  retry:
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2.0
    max-interval: 10000
  circuit-breaker:
    failure-threshold: 50
    success-threshold: 2
    wait-duration: 30000
    half-open-max-calls: 3
  timeout:
    default-timeout: 5000
    critical-timeout: 3000
  idempotency:
    key-expiry-hours: 24
    storage-type: in-memory

info:
  app:
    name: "Payment Resilience Service"
    description: "Microservicio de procesamiento de pagos con patrones de resiliencia"
    version: "1.0.0"
    author: "Pragma Engineering"
  features:
    - "Retry with exponential backoff"
    - "Circuit breaker pattern"
    - "Timeout handling"
    - "Idempotency key validation"
    - "Health monitoring via Actuator"
    - "Metrics collection"
  dependencies:
    - "Spring Boot 3.4"
    - "Resilience4j 2.4"
    - "Java 21"